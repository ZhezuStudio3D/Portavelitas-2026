<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instructivo Portavelitas - Zhezu Studio 3D</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #18181b;
      color: #f4f4f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
      gap: 18px;
    }

    .topbar {
      width: 100%;
      max-width: 1040px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #ffffff;
    }

    .mode-switch,
    .sub-controls,
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background: #ffffff;
      color: #18181b;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease, background-color 0.15s ease, color 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #e4e4e7;
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    button.active-mode {
      background: #f4f4f5;
      color: #18181b;
      outline: 2px solid #ffffff;
    }

    button.secondary-btn {
      background: #27272a;
      color: #f4f4f5;
      border: 1px solid #3f3f46;
    }

    button.secondary-btn:hover:not(:disabled) {
      background: #3f3f46;
    }

    .stage-wrap {
      width: 100%;
      max-width: 1040px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    /* MODO 1: FRISO / ACORDEÓN */
    .friso-view {
      width: 100%;
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .friso-view.active {
      display: flex;
    }

    .friso-track {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      border-left: 10px solid #27272a;
      transition: gap 0.28s ease;
    }

    .friso-track.folded {
      gap: 6px;
      padding: 12px;
      background: #27272a;
    }

    .friso-panel {
      position: relative;
      background: #ffffff;
      min-height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      cursor: zoom-in;
      box-shadow: inset 12px 0 18px -14px rgba(0, 0, 0, 0.22);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .friso-panel:hover {
      z-index: 2;
      box-shadow: inset 12px 0 18px -14px rgba(0, 0, 0, 0.3), 0 0 0 2px #27272a;
    }

    .friso-track.folded .friso-panel:nth-child(odd) {
      transform: perspective(900px) rotateY(4deg);
    }

    .friso-track.folded .friso-panel:nth-child(even) {
      transform: perspective(900px) rotateY(-4deg);
    }

    .friso-panel img {
      width: 100%;
      height: auto;
      max-height: 62vh;
      object-fit: contain;
      display: block;
    }

    .panel-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(24, 24, 27, 0.78);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 999px;
      pointer-events: none;
    }

    /* MODO 2: PASO A PASO (TARJETAS) */
    .cards-view {
      width: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .cards-view.active {
      display: flex;
    }

    .progress-bar-wrap {
      width: 100%;
      max-width: 820px;
      height: 6px;
      background: #27272a;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 12.5%;
      background: #ffffff;
      transition: width 0.25s ease;
    }

    .book-stage {
      width: 100%;
      max-width: 820px;
      background: #ffffff;
      color: #18181b;
      border-radius: 12px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55),
        inset 18px 0 28px -18px rgba(0, 0, 0, 0.25);
      border-left: 10px solid #27272a;
      padding: 24px;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      touch-action: pan-y;
    }

    .page {
      display: none;
      width: 100%;
      justify-content: center;
      align-items: center;
      animation: fadePage 0.25s ease;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadePage {
      from {
        opacity: 0;
        transform: translateX(10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .page img {
      width: 100%;
      height: auto;
      max-height: 70vh;
      object-fit: contain;
      display: block;
    }

    .page-indicator {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e4e4e7;
      min-width: 120px;
      text-align: center;
    }

    .fallback-msg {
      display: none;
      text-align: center;
      color: #18181b;
      font-size: 0.9rem;
      padding: 16px;
      line-height: 1.45;
    }

    img.broken + .fallback-msg {
      display: block;
    }

    img.broken {
      display: none !important;
    }

    /* MODAL DE INSPECCIÓN EN FRISO */
    .zoom-modal {
      position: fixed;
      inset: 0;
      background: rgba(9, 9, 11, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .zoom-modal.open {
      display: flex;
    }

    .zoom-box {
      background: #ffffff;
      color: #18181b;
      border-radius: 12px;
      max-width: 900px;
      width: 100%;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
    }

    .zoom-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .zoom-box img {
      width: 100%;
      height: auto;
      max-height: 75vh;
      object-fit: contain;
    }

    @media (max-width: 768px) {
      .friso-track {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .book-stage {
        min-height: 320px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand-title">Instructivo Portavelitas — Zhezu Studio 3D</div>
    <div class="mode-switch" role="tablist" aria-label="Modos de visualización">
      <button id="modeCardsBtn" type="button" class="active-mode">Paso a Paso (Tarjetas)</button>
      <button id="modeFrisoBtn" type="button" class="secondary-btn">Friso / Acordeón</button>
    </div>
  </header>

  <main class="stage-wrap">
    <!-- MODO 2: TARJETAS PASO A PASO (1/8 a 8/8) -->
