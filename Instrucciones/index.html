<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instructivo Portavelitas - Paso a Paso</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #18181b;
      color: #f4f4f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 18px;
    }

    .book-stage {
      width: 100%;
      max-width: 920px;
      background: #ffffff;
      color: #18181b;
      border-radius: 12px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55),
        inset 18px 0 28px -18px rgba(0, 0, 0, 0.25);
      border-left: 10px solid #27272a;
      padding: 24px;
      min-height: 420px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .page {
      display: none;
      width: 100%;
      justify-content: center;
      align-items: center;
      animation: fadePage 0.25s ease;
    }

    .page.active {
      display: flex;
    }

    @keyframes fadePage {
      from {
        opacity: 0;
        transform: translateX(10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .page img,
    .page svg {
      width: 100%;
      height: auto;
      max-height: 72vh;
      object-fit: contain;
      display: block;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    button {
      background: #ffffff;
      color: #18181b;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease, background-color 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #e4e4e7;
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .page-indicator {
      font-size: 0.95rem;
      font-weight: 500;
      color: #e4e4e7;
      min-width: 110px;
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="book-stage" aria-label="Instructivo interactivo en formato libro">
    <section class="page active" data-page="1">
      <img src="./pagina1.svg" alt="Instructivo Portavelitas página 1" />
    </section>

    <!-- Ejemplo si luego agregas más páginas:
    <section class="page" data-page="2">
      <img src="./pagina2.svg" alt="Instructivo Portavelitas página 2" />
    </section>
    -->
  </main>

  <div class="controls">
    <button id="prevBtn" type="button" disabled>Anterior</button>
    <span class="page-indicator" id="pageIndicator">Página 1 de 1</span>
    <button id="nextBtn" type="button" disabled>Siguiente</button>
  </div>

  <script>
    const pages = document.querySelectorAll('.page');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageIndicator = document.getElementById('pageIndicator');
    let currentPage = 0;

    function updateBook() {
      pages.forEach((page, idx) => {
        page.classList.toggle('active', idx === currentPage);
      });
      pageIndicator.textContent = `Página ${currentPage + 1} de ${pages.length}`;
      prevBtn.disabled = currentPage === 0;
      nextBtn.disabled = currentPage === pages.length - 1;
    }

    prevBtn.addEventListener('click', () => {
      if (currentPage > 0) {
        currentPage--;
        updateBook();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentPage < pages.length - 1) {
        currentPage++;
        updateBook();
      }
    });

    updateBook();
  </script>
</body>
</html>
