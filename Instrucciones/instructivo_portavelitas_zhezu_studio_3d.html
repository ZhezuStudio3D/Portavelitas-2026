<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Configuración básica y adaptativa para móviles, tabletas y escritorio -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instructivo Portavelitas - Zhezu Studio 3D</title>

  <!-- Tipografía Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS vía CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Reset seguro y estética de estudio oscuro con papel blanco y sombra de lomo */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #18181b;
      color: #f4f4f5;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Contenedor con sombra tipo lomo de libro sobre fondo oscuro #18181b */
    .book-stage {
      background: #ffffff;
      color: #18181b;
      border-radius: 12px;
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.55),
        inset 18px 0 28px -18px rgba(0, 0, 0, 0.25);
      border-left: 10px solid #27272a;
    }

    /* Escenario con perspectiva para el acordeón de paneles SVG */
    .accordion-viewport {
      perspective: 1700px;
      width: 100%;
      overflow-x: auto;
      padding: 20px 14px 28px;
    }

    .accordion-strip {
      display: grid;
      gap: 16px;
      transform-style: preserve-3d;
      transition: gap 0.35s ease;
    }

    .accordion-strip.folded {
      gap: 6px;
    }

    .panel-paper {
      position: relative;
      background: #ffffff;
      color: #18181b;
      border-radius: 10px;
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.38),
        inset 14px 0 22px -16px rgba(0, 0, 0, 0.22);
      border-left: 6px solid #27272a;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .accordion-strip.folded .panel-paper:nth-child(odd) {
      transform: rotateY(10deg);
    }

    .accordion-strip.folded .panel-paper:nth-child(even) {
      transform: rotateY(-10deg);
    }

    .accordion-strip.flat .panel-paper {
      transform: rotateY(0deg);
    }

    .panel-paper:hover {
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.5),
        0 0 0 2px rgba(255, 255, 255, 0.45);
    }

    /* Animación suave al pasar tarjeta */
    @keyframes fadeStep {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .step-fade {
      animation: fadeStep 0.24s ease;
    }
  </style>
</head>
<body class="bg-[#18181b] text-[#f4f4f5] min-h-screen flex flex-col">

  <!-- Encabezado y selectores de modo -->
  <header class="w-full max-w-6xl mx-auto px-4 sm:px-6 pt-5 pb-3 flex flex-col gap-3.5">
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <div>
        <p class="text-xs font-semibold uppercase tracking-widest text-zinc-400">Zhezu Studio 3D</p>
        <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">
          Instructivo Portavelitas - Zhezu Studio 3D
        </h1>
      </div>

      <!-- Selector principal: Friso / Acordeón vs Paso a Paso (Tarjetas) -->
      <div class="inline-flex rounded-xl bg-zinc-900 p-1 border border-zinc-800 self-start md:self-auto" role="tablist" aria-label="Modos de visualización">
        <button
          id="btnModeFriso"
          type="button"
          role="tab"
          aria-selected="true"
          class="px-4 py-2 rounded-lg text-sm font-semibold bg-white text-zinc-900 transition cursor-pointer"
        >
          Friso / Acordeón
        </button>
        <button
          id="btnModeSteps"
          type="button"
          role="tab"
          aria-selected="false"
          class="px-4 py-2 rounded-lg text-sm font-semibold text-zinc-300 hover:text-white transition cursor-pointer"
        >
          Paso a Paso (Tarjetas)
        </button>
      </div>
    </div>

    <!-- Controles secundarios exclusivos de Friso / Acordeón -->
    <div id="frisoControls" class="flex flex-wrap items-center justify-between gap-3 bg-zinc-900/90 border border-zinc-800 rounded-xl px-4 py-2.5">
      <div class="flex flex-wrap items-center gap-2">
        <div class="inline-flex rounded-lg bg-zinc-950 p-1 border border-zinc-800">
          <button
            id="btnFront"
            type="button"
            class="px-3.5 py-1.5 rounded-md text-xs sm:text-sm font-semibold bg-white text-zinc-900 transition cursor-pointer"
          >
            Frente (Paneles 1–4)
          </button>
          <button
            id="btnBack"
            type="button"
            class="px-3.5 py-1.5 rounded-md text-xs sm:text-sm font-semibold text-zinc-400 hover:text-white transition cursor-pointer"
          >
            Reverso (Paneles 5–8)
          </button>
        </div>

        <button
          id="btnFoldToggle"
          type="button"
          class="px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold bg-zinc-800 hover:bg-zinc-700 text-zinc-100 border border-zinc-700 transition cursor-pointer"
        >
          Extender Plano
        </button>
      </div>

      <span class="text-xs text-zinc-400">Haz clic en cualquier panel para ampliar</span>
    </div>
  </header>

  <!-- Área principal de visualización -->
  <main class="flex-1 w-full max-w-6xl mx-auto px-3 sm:px-6 pb-8 flex flex-col justify-center">

    <!-- MODO 1: FRISO / ACORDEÓN (Frente 1–4 / Reverso 5–8) -->
    <section id="frisoSection" aria-label="Vista Friso y Acordeón">
      <div class="accordion-viewport rounded-2xl bg-zinc-900/60 border border-zinc-800">
        <div id="accordionGrid" class="accordion-strip folded grid-cols-1 sm:grid-cols-2 lg:grid-cols-4">
          <!-- Paneles renderizados por JavaScript -->
        </div>
      </div>
    </section>

    <!-- MODO 2: PASO A PASO (TARJETAS 1/8 A 8/8) -->
    <section id="stepsSection" aria-label="Vista Paso a Paso en Tarjetas" class="hidden w-full max-w-3xl mx-auto">
      <!-- Barra de progreso y contador 1/8 a 8/8 -->
      <div class="mb-4">
        <div class="flex items-center justify-between text-xs sm:text-sm font-semibold text-zinc-300 mb-2">
          <span id="stepCounter">Paso 1/8</span>
          <span id="stepSideInfo" class="text-zinc-400">Frente · Panel 1</span>
        </div>
        <div class="w-full h-2.5 rounded-full bg-zinc-800 overflow-hidden border border-zinc-700">
          <div id="stepProgress" class="h-full bg-white rounded-full transition-all duration-300" style="width: 12.5%;"></div>
        </div>
      </div>

      <!-- Tarjeta grande del panel activo (soporta swipe táctil) -->
      <div id="stepStage" class="book-stage p-4 sm:p-6 min-h-[380px] flex flex-col items-center justify-center touch-pan-y select-none">
        <!-- Contenido inyectado por JavaScript -->
      </div>

      <!-- Botones Anterior / Siguiente -->
      <div class="mt-5 flex items-center justify-center gap-4">
        <button
          id="btnPrevStep"
          type="button"
          class="px-5 py-3 rounded-lg bg-white hover:bg-zinc-200 disabled:opacity-35 disabled:cursor-not-allowed text-zinc-900 font-semibold text-sm transition cursor-pointer"
        >
          Anterior
        </button>

        <span id="stepBottomLabel" class="text-sm font-medium text-zinc-300 min-w-[110px] text-center">
          Panel 1 de 8
        </span>

        <button
          id="btnNextStep"
          type="button"
          class="px-5 py-3 rounded-lg bg-white hover:bg-zinc-200 disabled:opacity-35 disabled:cursor-not-allowed text-zinc-900 font-semibold text-sm transition cursor-pointer"
        >
          Siguiente
        </button>
      </div>
    </section>
  </main>

  <!-- Modal de zoom para inspeccionar un panel en detalle -->
  <div
    id="zoomModal"
    class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-3 sm:p-6"
    role="dialog"
    aria-modal="true"
    aria-labelledby="zoomTitle"
  >
    <div class="relative w-full max-w-4xl book-stage p-4 sm:p-6 max-h-[92vh] overflow-y-auto flex flex-col gap-4">
      <div class="flex items-center justify-between gap-4 border-b border-zinc-200 pb-3">
        <div>
          <p id="zoomMeta" class="text-xs font-semibold uppercase tracking-wider text-zinc-500"></p>
          <h2 id="zoomTitle" class="text-lg sm:text-xl font-bold text-zinc-900"></h2>
        </div>
        <button
          id="btnCloseZoom"
          type="button"
          aria-label="Cerrar zoom"
          class="px-3.5 py-2 rounded-lg bg-zinc-900 hover:bg-zinc-800 text-white text-sm font-semibold transition cursor-pointer"
        >
          Cerrar
        </button>
      </div>

      <div id="zoomContent" class="w-full flex flex-col items-center justify-center">
        <!-- Imagen SVG ampliada inyectada por JavaScript -->
      </div>
    </div>
  </div>

  <script>
    /**
     * Definición de los 8 paneles SVG externos en la misma carpeta del instructivo.
     * Rutas exactas requeridas: ./panel-1.SVG hasta ./panel-8.SVG
     */
    const PANELS = [
      { number: 1, side: 'front', sideLabel: 'Frente', src: './panel-1.SVG', title: 'Panel 1' },
      { number: 2, side: 'front', sideLabel: 'Frente', src: './panel-2.SVG', title: 'Panel 2' },
      { number: 3, side: 'front', sideLabel: 'Frente', src: './panel-3.SVG', title: 'Panel 3' },
      { number: 4, side: 'front', sideLabel: 'Frente', src: './panel-4.SVG', title: 'Panel 4' },
      { number: 5, side: 'back',  sideLabel: 'Reverso', src: './panel-5.SVG', title: 'Panel 5' },
      { number: 6, side: 'back',  sideLabel: 'Reverso', src: './panel-6.SVG', title: 'Panel 6' },
      { number: 7, side: 'back',  sideLabel: 'Reverso', src: './panel-7.SVG', title: 'Panel 7' },
      { number: 8, side: 'back',  sideLabel: 'Reverso', src: './panel-8.SVG', title: 'Panel 8' }
    ];

    // Estado de la aplicación
    const appState = {
      mode: 'friso',   // 'friso' | 'steps'
      side: 'front',   // 'front' (1-4) | 'back' (5-8)
      folded: true,    // true = acordeón plegado | false = extendido plano
      stepIndex: 0     // 0..7
    };

    // Elementos del DOM
    const btnModeFriso = document.getElementById('btnModeFriso');
    const btnModeSteps = document.getElementById('btnModeSteps');
    const frisoControls = document.getElementById('frisoControls');
    const frisoSection = document.getElementById('frisoSection');
    const stepsSection = document.getElementById('stepsSection');

    const btnFront = document.getElementById('btnFront');
    const btnBack = document.getElementById('btnBack');
    const btnFoldToggle = document.getElementById('btnFoldToggle');
    const accordionGrid = document.getElementById('accordionGrid');

    const stepCounter = document.getElementById('stepCounter');
    const stepSideInfo = document.getElementById('stepSideInfo');
    const stepProgress = document.getElementById('stepProgress');
    const stepStage = document.getElementById('stepStage');
    const stepBottomLabel = document.getElementById('stepBottomLabel');
    const btnPrevStep = document.getElementById('btnPrevStep');
    const btnNextStep = document.getElementById('btnNextStep');

    const zoomModal = document.getElementById('zoomModal');
    const btnCloseZoom = document.getElementById('btnCloseZoom');
    const zoomMeta = document.getElementById('zoomMeta');
    const zoomTitle = document.getElementById('zoomTitle');
    const zoomContent = document.getElementById('zoomContent');

    /**
     * Crea un contenedor de imagen SVG con manejo limpio de errores si no carga el archivo.
     */
    function createSvgElement(panel, extraImgClass = '') {
      const wrapper = document.createElement('div');
      wrapper.className = 'w-full flex flex-col items-center justify-center';

      const img = document.createElement('img');
      img.src = panel.src;
      img.alt = `Instructivo Portavelitas Zhezu Studio 3D - ${panel.title} (${panel.sideLabel})`;
      img.loading = 'eager';
      img.className = `w-full h-auto max-h-[68vh] object-contain block select-none ${extraImgClass}`;

      const fallbackBox = document.createElement('div');
      fallbackBox.className = 'hidden w-full rounded-lg border border-dashed border-zinc-300 bg-zinc-50 p-5 text-center text-zinc-700';
      fallbackBox.innerHTML = `
        <p class="text-sm font-semibold text-zinc-900">No se pudo cargar ${panel.src}</p>
        <p class="text-xs text-zinc-500 mt-1">Verifica que el archivo <strong>${panel.src}</strong> exista en la misma carpeta que index.html y respete mayúsculas/minúsculas.</p>
      `;

      img.addEventListener('error', () => {
        try {
          img.classList.add('hidden');
          fallbackBox.classList.remove('hidden');
        } catch (err) {
          // Evitar interrupciones si el elemento ya no está en el DOM
        }
      });

      wrapper.appendChild(img);
      wrapper.appendChild(fallbackBox);
      return wrapper;
    }

    /**
     * Abre el modal de zoom con el panel seleccionado.
     */
    function openZoomModal(panel) {
      try {
        zoomMeta.textContent = `${panel.sideLabel} · Archivo ${panel.src}`;
        zoomTitle.textContent = `${panel.title} — Instructivo Portavelitas`;
        zoomContent.innerHTML = '';
        zoomContent.appendChild(createSvgElement(panel, 'max-h-[75vh]'));
        zoomModal.classList.remove('hidden');
        zoomModal.classList.add('flex');
      } catch (err) {
        // Error controlado sin alert()
      }
    }

    function closeZoomModal() {
      zoomModal.classList.add('hidden');
      zoomModal.classList.remove('flex');
    }

    /**
     * Renderiza la vista Friso / Acordeón para Frente (1–4) o Reverso (5–8).
     */
    function renderFriso() {
      const visiblePanels = PANELS.filter((p) => p.side === appState.side);

      // Actualizar estilo de botones Frente / Reverso
      const isFront = appState.side === 'front';
      btnFront.className = isFront
        ? 'px-3.5 py-1.5 rounded-md text-xs sm:text-sm font-semibold bg-white text-zinc-900 transition cursor-pointer'
        : 'px-3.5 py-1.5 rounded-md text-xs sm:text-sm font-semibold text-zinc-400 hover:text-white transition cursor-pointer';
      btnBack.className = !isFront
        ? 'px-3.5 py-1.5 rounded-md text-xs sm:text-sm font-semibold bg-white text-zinc-900 transition cursor-pointer'
        : 'px-3.5 py-1.5 rounded-md text-xs sm:text-sm font-semibold text-zinc-400 hover:text-white transition cursor-pointer';

      // Actualizar botón Plegar / Extender Plano
      btnFoldToggle.textContent = appState.folded ? 'Extender Plano' : 'Plegar Acordeón';
      accordionGrid.className = `accordion-strip ${appState.folded ? 'folded' : 'flat'} grid-cols-1 sm:grid-cols-2 lg:grid-cols-4`;

      accordionGrid.innerHTML = '';

      visiblePanels.forEach((panel) => {
        const card = document.createElement('article');
        card.className = 'panel-paper p-3 sm:p-4 flex flex-col justify-between min-h-[260px]';
        card.setAttribute('tabindex', '0');
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', `Ampliar ${panel.title} (${panel.sideLabel})`);

        const headerBar = document.createElement('div');
        headerBar.className = 'flex items-center justify-between text-[11px] font-semibold text-zinc-500 mb-2 pb-1.5 border-b border-zinc-200/80';
        headerBar.innerHTML = `
          <span>${panel.title} · ${panel.sideLabel}</span>
          <span class="text-zinc-400">Zoom</span>
        `;

        card.appendChild(headerBar);
        card.appendChild(createSvgElement(panel));

        card.addEventListener('click', () => openZoomModal(panel));
        card.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openZoomModal(panel);
          }
        });

        accordionGrid.appendChild(card);
      });
    }

    /**
     * Renderiza la vista Paso a Paso (Tarjetas 1/8 a 8/8).
     */
    function renderSteps() {
      const total = PANELS.length;
      const current = PANELS[appState.stepIndex];

      stepCounter.textContent = `Paso ${appState.stepIndex + 1}/${total}`;
      stepSideInfo.textContent = `${current.sideLabel} · ${current.title}`;
      stepBottomLabel.textContent = `Panel ${current.number} de ${total}`;
      stepProgress.style.width = `${((appState.stepIndex + 1) / total) * 100}%`;

      btnPrevStep.disabled = appState.stepIndex === 0;
      btnNextStep.disabled = appState.stepIndex === total - 1;

      stepStage.innerHTML = '';
      const stepInner = document.createElement('div');
      stepInner.className = 'w-full step-fade flex flex-col items-center justify-center';

      const topBar = document.createElement('div');
      topBar.className = 'w-full flex items-center justify-between text-xs font-semibold text-zinc-500 mb-3 pb-2 border-b border-zinc-200';
      topBar.innerHTML = `
        <span>${current.title} (${current.sideLabel})</span>
        <span>${appState.stepIndex + 1} / ${total}</span>
      `;

      stepInner.appendChild(topBar);
      stepInner.appendChild(createSvgElement(current));
      stepStage.appendChild(stepInner);
    }

    /**
     * Cambia entre los modos Friso / Acordeón y Paso a Paso (Tarjetas).
     */
    function setMode(mode) {
      appState.mode = mode;
      const isFriso = mode === 'friso';

      btnModeFriso.setAttribute('aria-selected', String(isFriso));
      btnModeSteps.setAttribute('aria-selected', String(!isFriso));

      btnModeFriso.className = isFriso
        ? 'px-4 py-2 rounded-lg text-sm font-semibold bg-white text-zinc-900 transition cursor-pointer'
        : 'px-4 py-2 rounded-lg text-sm font-semibold text-zinc-300 hover:text-white transition cursor-pointer';

      btnModeSteps.className = !isFriso
        ? 'px-4 py-2 rounded-lg text-sm font-semibold bg-white text-zinc-900 transition cursor-pointer'
        : 'px-4 py-2 rounded-lg text-sm font-semibold text-zinc-300 hover:text-white transition cursor-pointer';

      frisoSection.classList.toggle('hidden', !isFriso);
      frisoControls.classList.toggle('hidden', !isFriso);
      stepsSection.classList.toggle('hidden', isFriso);

      if (isFriso) {
        renderFriso();
      } else {
        renderSteps();
      }
    }

    // Eventos de botones principales
    btnModeFriso.addEventListener('click', () => setMode('friso'));
    btnModeSteps.addEventListener('click', () => setMode('steps'));

    btnFront.addEventListener('click', () => {
      appState.side = 'front';
      renderFriso();
    });

    btnBack.addEventListener('click', () => {
      appState.side = 'back';
      renderFriso();
    });

    btnFoldToggle.addEventListener('click', () => {
      appState.folded = !appState.folded;
      renderFriso();
    });

    btnPrevStep.addEventListener('click', () => {
      if (appState.stepIndex > 0) {
        appState.stepIndex--;
        renderSteps();
      }
    });

    btnNextStep.addEventListener('click', () => {
      if (appState.stepIndex < PANELS.length - 1) {
        appState.stepIndex++;
        renderSteps();
      }
    });

    // Cerrar modal con botón o clic en fondo oscuro
    btnCloseZoom.addEventListener('click', closeZoomModal);
    zoomModal.addEventListener('click', (e) => {
      if (e.target === zoomModal) {
        closeZoomModal();
      }
    });

    // Navegación con flechas izquierda/derecha del teclado en Paso a Paso y Escape en modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !zoomModal.classList.contains('hidden')) {
        closeZoomModal();
        return;
      }

      if (appState.mode === 'steps') {
        if (e.key === 'ArrowRight' && appState.stepIndex < PANELS.length - 1) {
          appState.stepIndex++;
          renderSteps();
        } else if (e.key === 'ArrowLeft' && appState.stepIndex > 0) {
          appState.stepIndex--;
          renderSteps();
        }
      }
    });

    // Navegación táctil por deslizamiento (swipe) en tarjetas Paso a Paso
    let touchStartX = 0;
    let touchEndX = 0;

    stepStage.addEventListener('touchstart', (e) => {
      if (e.changedTouches && e.changedTouches.length > 0) {
        touchStartX = e.changedTouches[0].clientX;
      }
    }, { passive: true });

    stepStage.addEventListener('touchend', (e) => {
      if (e.changedTouches && e.changedTouches.length > 0) {
        touchEndX = e.changedTouches[0].clientX;
        const diff = touchEndX - touchStartX;
        const threshold = 45;

        if (diff < -threshold && appState.stepIndex < PANELS.length - 1) {
          appState.stepIndex++;
          renderSteps();
        } else if (diff > threshold && appState.stepIndex > 0) {
          appState.stepIndex--;
          renderSteps();
        }
      }
    }, { passive: true });

    // Inicialización de ambas vistas
    renderFriso();
    renderSteps();
  </script>
</body>
</html>
